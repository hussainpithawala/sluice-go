# .golangci.yml
version: "2"  # Must be a string, not a number

run:
  timeout: 5m
  modules-download-mode: readonly

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - unused
    - gocritic
    - bodyclose
    - goconst
    - gocyclo
    - misspell
    - prealloc
    - whitespace
  exclusions:
    rules:
      # Repeated literals in tests are fixtures; hoisting them hurts readability.
      - path: _test\.go
        linters:
          - goconst


issues:
  max-same-issues: 50
  max-issues-per-linter: 50
